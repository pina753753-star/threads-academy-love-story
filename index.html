<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Threads学園 恋物語 〜桜の散らない春〜</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; min-height: 100%; background:#fff7fb; }
    .loading { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,sans-serif; color:#9c4f74; background:#fff7fb; padding:24px; text-align:center; line-height:1.8; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">読み込み中...</div></div>
  <script>
    (async function () {
      const repo = "pina753753-star/threads-academy-love-story";
      const blobSha = "dec51b7df8c189f9b51f292e9b81f8a88912b34b";
      try {
        const api = `https://api.github.com/repos/${repo}/git/blobs/${blobSha}`;
        const res = await fetch(api);
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        const data = await res.json();
        const b64 = data.content.replace(/\s/g, "");
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        let code = new TextDecoder("utf-8").decode(bytes);

        code = code.replace(/import\s*\{\s*useState\s*,\s*useMemo\s*\}\s*from\s*["']react["'];?/, "const { useState, useMemo } = React;");
        code = code.replace(/export\s+default\s+function\s+OtomeGame/, "function OtomeGame");
        code += "\nReactDOM.createRoot(document.getElementById('root')).render(<OtomeGame />);";

        const js = Babel.transform(code, { presets: ["env", "react"] }).code;
        new Function(js)();
      } catch (error) {
        console.error(error);
        document.getElementById("root").innerHTML = `<div class="loading">読み込みに失敗しました。<br>${String(error.message || error)}</div>`;
      }
    })();
  </script>
</body>
</html>
