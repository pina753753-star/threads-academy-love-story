<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Threads学園 恋物語 〜桜の散らない春〜</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #fdeef3;
    }
    #root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    .loading {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      color: #9c4f74;
      background: #fff7fb;
      padding: 24px;
      text-align: center;
      line-height: 1.8;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading">読み込み中...</div></div>
  <script>
    (async function () {
      const repo = "pina753753-star/threads-academy-love-story";
      const baseGameBlobSha = "aa3e0328c4ef800af9f3cd7bec862fa863e50734";
      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/git/blobs/${baseGameBlobSha}?v=8`, { cache: "no-store" });
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        const data = await res.json();
        const b64 = data.content.replace(/\s/g, "");
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        let html = new TextDecoder("utf-8").decode(bytes);

        html = html.replace(
          /body \{ background: #fdeef3; overflow-x: hidden; \}\s*#root \{ min-height: 100vh; \}/,
          `html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: #fdeef3;
}
#root {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
}`
        );

        // Remove the old 4-week auto-confession branch robustly.
        const marker = "// 4話完了チェック：currentRouteIdのキャラを4回選んだら告白へ";
        const start = html.indexOf(marker);
        if (start !== -1) {
          const nextMarker = "const next = turn + 1;";
          const end = html.indexOf(nextMarker, start);
          if (end !== -1) {
            html = html.slice(0, start) + html.slice(end);
          }
        }

        // Fallback cleanup, in case spacing differs.
        html = html.replace(
          /\s*\/\/ 4話完了チェック：currentRouteIdのキャラを4回選んだら告白へ[\s\S]*?const next = turn \+ 1;/,
          "\n    const next = turn + 1;"
        );

        html = html.replace(
          /<div style=\{\{ fontSize: 12, color: "#a98aa0", letterSpacing: 2, marginTop: 10, textShadow: "0 1px 4px rgba\(255,255,255,\.9\)" \}\}>\s*7週間で、運命の相手を見つけよう\s*<\/div>/,
          ""
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.getElementById("root").innerHTML = `<div class="loading">読み込みに失敗しました。<br>${String(error.message || error)}</div>`;
      }
    })();
  </script>
</body>
</html>
